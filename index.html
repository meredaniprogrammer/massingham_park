<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeHarmony | A happy home runs together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="landing-page">
  <main class="hero-shell">
    <section class="hero-copy reveal">
      <a class="brand brand-large" href="index.html" aria-label="HomeHarmony home">
        <span class="brand-mark">H</span>
        <span>Home<span>Harmony</span></span>
      </a>
      <h1>HomeHarmony</h1>
      <p class="tagline">A happy home runs together.</p>
      <p class="hero-text">Organise shared responsibilities, weekly waste turns, notices and house reminders in one calm private space.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="login.html">Get Started</a>
        <a class="btn btn-soft" href="admin-login.html">Login</a>
      </div>
    </section>
    <section class="hero-visual reveal delay-1" aria-label="Warm modern living room">
      <img src="assets/images/living-room.svg" alt="Bright living room with plants and a sofa">
      <div class="glass-stat stat-top">
        <span class="icon">♻</span>
        <strong>Trash day</strong>
        <small>Set your schedule</small>
      </div>
      <div class="glass-stat stat-bottom">
        <span class="avatar mini">S</span>
        <strong>Current turn</strong>
        <small>Reminder set</small>
      </div>
    </section>
  </main>
  <script src="js/firebase.js" type="module"></script>
