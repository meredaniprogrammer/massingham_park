<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings | HomeHarmony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-page">
  <div class="app-layout">
    <aside class="sidebar" data-nav="user"></aside>
    <main class="main-content narrow">
      <header class="page-header"><h1>Settings</h1><p>Personalise your room profile.</p></header>
      <section class="settings-card reveal">
        <form id="settingsForm" class="form-stack">
          <div class="profile-uploader">
            <img id="profilePreview" src="assets/images/avatar.svg" alt="Profile preview">
            <input id="profilePhoto" name="profilePhoto" type="file" accept="image/*">
          </div>
          <label for="displayName">Display name</label>
          <input id="displayName" name="displayName" required>
          <label for="loginCode">Login ID</label>
          <div class="inline-field">
            <input id="loginCode" name="loginCode" autocomplete="off" required>
            <button id="generateLoginCode" class="btn btn-soft" type="button">Reset ID</button>
          </div>
          <div class="setting-line"><span>Theme</span><select id="theme"><option>Light lavender</option><option>Warm white</option></select></div>
          <div class="setting-line"><span>Notifications</span><label class="switch"><input id="notifications" type="checkbox" checked><span></span></label></div>
          <button class="btn btn-primary full" type="submit">Save settings</button>
          <button id="logout" class="btn btn-soft full" type="button">Log out</button>
        </form>
      </section>
    </main>
  </div>
  <nav class="bottom-nav" data-nav="user"></nav>
  <div id="toast-root"></div>
  <script src="js/settings.js" type="module"></script>
</body>
</html>
