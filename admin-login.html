<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | HomeHarmony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
  <main class="auth-shell compact">
    <section class="auth-card reveal">
      <a class="brand center" href="index.html"><span class="brand-mark">H</span><span>Home<span>Harmony</span></span></a>
      <h2>Admin login</h2>
      <p class="muted">Manage weekly turns, notices and room settings.</p>
      <form id="adminLoginForm" class="form-stack">
        <label for="adminId">Admin ID</label>
        <input id="adminId" name="adminId" placeholder="Enter admin ID" autocomplete="off" required>
        <label for="adminPin">PIN</label>
        <input id="adminPin" name="adminPin" placeholder="Enter PIN" inputmode="numeric" type="password" required>
        <button class="btn btn-primary full" type="submit">Login</button>
      </form>
      <a class="text-link" href="login.html">Room login</a>
    </section>
  </main>
  <div id="toast-root"></div>
  <script src="js/auth.js" type="module"></script>
</body>
</html>
