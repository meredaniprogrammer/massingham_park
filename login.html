<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Login | HomeHarmony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-art reveal">
      <a class="brand" href="index.html"><span class="brand-mark">H</span><span>Home<span>Harmony</span></span></a>
      <img src="assets/images/login-illustration.svg" alt="Housemates sharing a tidy home">
      <h1>Welcome back! 👋</h1>
      <p>Use your private room code to enter your shared home dashboard.</p>
    </section>
    <section class="auth-card reveal delay-1">
      <h2>Room login</h2>
      <p class="muted">No email or password required.</p>
      <form id="roomLoginForm" class="form-stack">
        <label for="roomCode">Room ID</label>
        <input id="roomCode" name="roomCode" placeholder="Enter your room code" autocomplete="off" required>
        <button class="btn btn-primary full" type="submit">Continue</button>
      </form>
      <a class="text-link" href="admin-login.html">Admin login</a>
    </section>
  </main>
  <div id="toast-root"></div>
  <script src="js/auth.js" type="module"></script>
</body>
</html>
