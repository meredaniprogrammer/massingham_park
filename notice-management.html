<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notice Management | HomeHarmony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-page">
  <div class="app-layout">
    <aside class="sidebar" data-nav="admin"></aside>
    <main class="main-content narrow">
      <header class="page-header"><h1>Notice management</h1><p>Publish a clear house notice for everyone.</p></header>
      <section class="settings-card reveal">
        <form id="noticeForm" class="form-stack">
          <label for="noticeTitle">Title</label>
          <input id="noticeTitle" required placeholder="Notice title">
          <label for="noticeMessage">Message</label>
          <textarea id="noticeMessage" required rows="6" placeholder="Share the details..."></textarea>
          <button class="btn btn-primary full" type="submit">Publish Notice</button>
        </form>
      </section>
      <section id="noticeList" class="notice-list compact-list"></section>
    </main>
  </div>
  <nav class="bottom-nav" data-nav="admin"></nav>
  <div id="toast-root"></div>
  <script src="js/notices.js" type="module"></script>
</body>
</html>
